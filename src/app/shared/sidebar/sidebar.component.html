<div class="w-64 bg-white shadow-lg h-full flex flex-col p-4 rounded-lg">
    <!-- 🧑‍💼 Profile + Branding -->
    <div [ngClass]="{'bg-primary-950': userType === 'user', 'bg-primary-900': userType === 'drone', 'bg-primary-950': userType === 'pilot'}"
         class="p-4 rounded-xl w-full text-white mb-6 shadow-sm">
      <div class="flex items-center gap-4">
        <img loading="lazy" class="w-12 h-12 rounded-full border-2"
             [ngClass]="{'border-primary-500': userType === 'user', 'border-primary-500': userType === 'drone', 'border-primary-500': userType === 'pilot'}"
             src="https://i.pravatar.cc/300" alt="User profile" />
        <div>
          <p class="text-sm font-semibold" [ngClass]="{'text-primary-400': userType === 'user', 'text-primary-400': userType === 'drone', 'text-primary-400': userType === 'pilot'}">
            Hi, {{ userName }}
          </p>
          <p class="text-xs text-gray-300">Welcome back!</p>
        </div>
      </div>
      <div class="mt-4 pt-2 border-t"
           [ngClass]="{'border-primary-800': userType === 'user', 'border-primary-800': userType === 'drone', 'border-primary-800': userType === 'pilot'}">
        <p class="text-lg font-bold" [ngClass]="{'text-primary-400': userType === 'user', 'text-primary-400': userType === 'drone', 'text-primary-400': userType === 'pilot'}">
          {{ sidebarTitle }}
        </p>
      </div>
    </div>
  
    <!-- 🔍 Search -->
    <div class="mb-5">
      <input type="text" placeholder="🔎 Search..."
        class="w-full px-4 py-2 rounded-md border border-primary-200 bg-primary-50 text-sm text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
    </div>
  
    <!-- 📂 Navigation -->
    <nav class="flex-1 space-y-2 text-sm font-medium text-gray-700">
      <!-- Common links for all users -->
      <a [routerLink]="['home']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faComments" class="text-primary-600 w-5 h-5"></fa-icon>
        Chat
      </a>
  
      <a [routerLink]="['opportunity']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faBriefcase" class="text-primary-600 w-5 h-5"></fa-icon>
        Opportunities
      </a>
  
      <a [routerLink]="['event']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faCalendarDays" class="text-primary-600 w-5 h-5"></fa-icon>
        Events
      </a>
  
      <a [routerLink]="['post']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faNewspaper" class="text-primary-600 w-5 h-5"></fa-icon>
        Newsfeed
      </a>
  
      <a [routerLink]="['education']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faGraduationCap" class="text-primary-600 w-5 h-5"></fa-icon>
        Education
      </a>
  
      <!-- User-specific links -->
      <ng-container *ngIf="userType === 'drone'">
        <a [routerLink]="['book']"
           routerLinkActive="bg-primary-100"
           class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
          <fa-icon [icon]="faCalendarCheck" class="text-primary-600 w-5 h-5"></fa-icon>
          My Bookings
        </a>
    
        <a [routerLink]="['service']"
           routerLinkActive="bg-primary-100"
           class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
          <fa-icon [icon]="faCogs" class="text-primary-600 w-5 h-5"></fa-icon>
          Services
        </a>
      </ng-container>
  
      <ng-container *ngIf="userType === 'pilot'">
        <a [routerLink]="['overview']"
           routerLinkActive="bg-primary-100 text-primary-700"
           class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
          <fa-icon [icon]="['fas', 'chart-pie']" class="text-primary-600 w-5 h-5"></fa-icon>
          Overview
        </a>
    
        <a [routerLink]="['geodron']"
           routerLinkActive="bg-primary-100 text-primary-700"
           class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
          <fa-icon [icon]="['fas', 'map-marked-alt']" class="text-green-600 w-5 h-5"></fa-icon>
          Geospatial
        </a>
    
        <a [routerLink]="['ceremony']"
           routerLinkActive="bg-primary-100 text-primary-700"
           class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
          <fa-icon [icon]="['fas', 'camera-retro']" class="text-pink-600 w-5 h-5"></fa-icon>
          Ceremonies
        </a>
      </ng-container>
    </nav>
  
    <!-- 🧩 Settings & Actions -->
    <div class="mt-auto pt-4 border-t border-primary-100 space-y-2 text-sm text-gray-700">
      <a [routerLink]="['profile']"
         routerLinkActive="bg-primary-100"
         class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faUser" class="text-primary-600 w-5 h-5"></fa-icon>
        My Profile
      </a>
  
      <a [routerLink]="['settings']"
         routerLinkActive="bg-primary-100"
         class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faCog" class="text-primary-600 w-5 h-5"></fa-icon>
        Settings
      </a>
  
      <!-- 🚪 Logout -->
      <button (click)="logout()"
              class="mt-4 w-full flex items-center gap-3 text-red-600 hover:bg-red-100 p-2 rounded-md transition text-left">
        <fa-icon [icon]="faRightFromBracket" class="w-5 h-5"></fa-icon>
        Logout
      </button>
    </div>
  </div>
