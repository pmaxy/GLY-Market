<div class="space-y-6 text-gray-800 dark:text-gray-100">
  <!-- Title and Search -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <h2 class="text-xl sm:text-2xl font-bold">🚁 Available Drone Services</h2>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Search services..."
      class="w-full sm:w-64 px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 rounded-md shadow-sm text-sm focus:outline-none focus:ring focus:ring-primary-300"
    />
  </div>

  <!-- Service Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    <div
      *ngFor="let service of filteredServices()"
      class="bg-primary-50 dark:bg-gray-800 p-4 sm:p-6 rounded-lg shadow hover:shadow-lg transition group"
    >
      <div class="flex items-center gap-3 mb-4">
        <div
          class="bg-primary-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400 p-3 rounded-full group-hover:bg-primary-200 dark:group-hover:bg-gray-600 transition"
        >
          <fa-icon [icon]="service.icon" class="w-6 h-6"></fa-icon>
        </div>
        <h3 class="text-base sm:text-lg font-semibold text-gray-800 dark:text-white">
          {{ service.title }}
        </h3>
      </div>
      <p class="text-sm sm:text-base text-gray-600 dark:text-gray-300 mb-4">
        {{ service.description }}
      </p>
      <a
        [routerLink]="['/dronesuser/services', service.type]"
        class="mt-4 inline-block w-full text-center bg-primary-600 text-white text-sm font-medium py-2 px-4 rounded hover:bg-primary-700 transition"
      >
        Book Now
      </a>
    </div>

    <!-- Empty state -->
    <div *ngIf="filteredServices().length === 0" class="col-span-full text-center text-gray-500 dark:text-gray-400">
      No services found. Try a different search.
    </div>
  </div>
</div>
