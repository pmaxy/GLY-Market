<div class="space-y-6">
  <!-- Title and Search -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <h2 class="text-xl sm:text-2xl font-bold text-gray-800">🚁 Available Drone Services</h2>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Search services..."
      class="w-full sm:w-64 px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring focus:ring-primary-300"
    />
  </div>

  <!-- Service Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    <div
      *ngFor="let service of filteredServices()"
      class="bg-primary-50 p-4 sm:p-6 rounded-lg shadow hover:shadow-lg transition group"
    >
      <div class="flex items-center gap-3 mb-4">
        <div
          class="bg-primary-100 text-primary-600 p-3 rounded-full group-hover:bg-primary-200 transition"
        >
          <fa-icon [icon]="service.icon" class="w-6 h-6"></fa-icon>
        </div>
        <h3 class="text-base sm:text-lg font-semibold text-gray-800">
          {{ service.title }}
        </h3>
      </div>
      <p class="text-sm sm:text-base text-gray-600 mb-4">
        {{ service.description }}
      </p>
      <a
        [routerLink]="['/dronesuser/services', service.type]"
        class="mt-4 inline-block w-full text-center bg-primary-600 text-white text-sm font-medium py-2 px-4 rounded hover:bg-primary-700 transition"
      >
        Book Now
      </a>
    </div>

    <!-- Empty state -->
    <div *ngIf="filteredServices().length === 0" class="col-span-full text-center text-gray-500">
      No services found. Try a different search.
    </div>
  </div>
</div>
