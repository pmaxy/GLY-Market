<div class="space-y-6">
  <div class="flex items-center justify-between flex-wrap gap-2">
    <h2 class="text-2xl font-bold text-gray-800">📅 My Bookings</h2>
    <button
      class="inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 active:bg-primary-800 focus:ring-2 focus:ring-primary-300 text-white font-semibold py-2 px-5 rounded-md shadow-md transition duration-200 ease-in-out"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      New Booking
    </button>
  </div>

  <!-- Booking Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let booking of bookings" class="bg-primary-50 p-4 rounded shadow">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-lg font-semibold">{{ booking.service }}</h3>
        <span class="text-sm text-gray-500">{{ booking.date | date:'mediumDate' }}</span>
      </div>
      <p class="text-sm text-gray-600 mb-2">Location: {{ booking.location }}</p>
      <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold"
            [ngClass]="{
              'bg-yellow-100 text-yellow-800': booking.status === 'Pending',
              'bg-green-200 text-green-800': booking.status === 'Confirmed',
              'bg-red-100 text-red-800': booking.status === 'Cancelled'
            }">
        {{ booking.status }}
      </span>
      <div class="mt-4 flex justify-end space-x-2">
        <button class="text-primary-600 hover:text-primary-800" title="View booking">
          <fa-icon [icon]="faEye"></fa-icon>
        </button>
        <button
          class="text-red-600 hover:text-red-800"
          title="Cancel booking"
          *ngIf="booking.status === 'Pending'"
          (click)="cancelBooking(booking)">
          <fa-icon [icon]="faBan"></fa-icon>
        </button>
      </div>
    </div>
  </div>
</div>
