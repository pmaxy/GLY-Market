<div class="space-y-6">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-2xl font-bold text-gray-800">📅 My Bookings</h2>
      <button
      class="inline-flex items-center gap-2 bg-primary-600 hover:bg-primary-700 active:bg-primary-800 focus:ring-2 focus:ring-primary-300 text-white font-semibold py-2 px-5 rounded-md shadow-md transition duration-200 ease-in-out"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      New Booking
    </button>
    </div>
  
    <div class="bg-white rounded shadow p-4 overflow-auto">
      <table mat-table [dataSource]="dataSource" matSort class="min-w-full">
  
        <!-- Service Column -->
        <ng-container matColumnDef="service">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Service</th>
          <td mat-cell *matCellDef="let booking">{{ booking.service }}</td>
        </ng-container>
  
        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
          <td mat-cell *matCellDef="let booking">{{ booking.date | date:'mediumDate' }}</td>
        </ng-container>
  
        <!-- Location Column -->
        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Location</th>
          <td mat-cell *matCellDef="let booking">{{ booking.location }}</td>
        </ng-container>
  
        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let booking">
            <span
              class="px-3 py-1 rounded-full text-xs font-semibold"
              [ngClass]="{
                'bg-yellow-100 text-yellow-800': booking.status === 'Pending',
                'bg-green-100 text-green-800': booking.status === 'Confirmed',
                'bg-red-100 text-red-800': booking.status === 'Cancelled'
              }"
            >
              {{ booking.status }}
            </span>
          </td>
        </ng-container>
  
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-right">Actions</th>
          <td mat-cell *matCellDef="let booking" class="text-right space-x-2">
            <button mat-button color="primary" matTooltip="View booking">
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-button
              color="warn"
              matTooltip="Cancel booking"
              *ngIf="booking.status === 'Pending'"
              (click)="cancelBooking(booking)"
            >
              <mat-icon>cancel</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  
        <!-- Empty State -->
        <tr class="text-center" *ngIf="dataSource.data.length === 0">
          <td colspan="5" class="py-10 text-gray-500">
            <mat-icon class="text-5xl mb-2 text-gray-300">event_busy</mat-icon>
            <p>No bookings available. Start by creating a new one!</p>
          </td>
        </tr>
      </table>
  
      <!-- Pagination -->
      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]"></mat-paginator>
    </div>
  </div>
