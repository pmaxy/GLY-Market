<div class="w-64 bg-white shadow-lg h-full flex flex-col p-4 rounded-lg">

    <!-- 🧑‍💼 Profile + Branding -->
    <div class="bg-primary-900 p-4 rounded-xl w-full text-white mb-6 shadow-sm">
      <div class="flex items-center gap-4">
        <img loading="lazy" class="w-12 h-12 rounded-full border-2 border-primary-500 shadow"
          src="https://i.pravatar.cc/300" alt="User profile" />
        <div>
          <p class="text-sm font-semibold">Hi, User</p>
          <p class="text-xs text-gray-300">Welcome back!</p>
        </div>
      </div>
      <div class="mt-4 pt-2 border-t border-primary-800">
        <p class="text-lg font-bold text-primary-400 tracking-widest">Drone+ User</p>
      </div>
    </div>
  
    <!-- 🔍 Search -->
    <div class="mb-5">
      <input type="text" placeholder="🔎 Search..."
        class="w-full px-4 py-2 rounded-md border border-primary-200 bg-primary-50 text-sm text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
    </div>
  
    <!-- 📂 Navigation -->
    <nav class="flex-1 space-y-2 text-sm font-medium text-gray-700">
      <a [routerLink]="['book']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faCalendarCheck" class="text-primary-600 w-5 h-5"></fa-icon>
        My Bookings
      </a>
  
      <a [routerLink]="['service']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faCogs" class="text-primary-600 w-5 h-5"></fa-icon>
        Services
      </a>
  
      <a [routerLink]="['profile']"
        routerLinkActive="bg-primary-100"
        class="flex items-center gap-3 p-2 rounded-md transition hover:bg-primary-100 hover:text-primary-700">
        <fa-icon [icon]="faUserCircle" class="text-primary-600 w-5 h-5"></fa-icon>
        Profile
      </a>
    </nav>
  
    <!-- 🚪 Logout -->
    <div class="mt-auto pt-4 border-t border-primary-100">
      <button (click)="logout()"
        class="w-full flex items-center gap-3 text-red-600 hover:bg-red-100 p-2 rounded-md transition text-left">
        <fa-icon [icon]="faRightFromBracket" class="w-5 h-5"></fa-icon>
        Logout
      </button>
    </div>
  </div>
