<div [ngClass]="themeClass" class="min-h-screen">
  <!-- Loading Spinner Overlay -->
  <div class="loading-overlay" *ngIf="isLoading" [class.active]="isLoading">
    <app-spinner></app-spinner>
  </div>

  <!-- Whole screen layout -->
  <div class="flex flex-col md:flex-row h-screen bg-white dark:bg-gray-900 text-black dark:text-white relative">
    
    <!-- Mobile overlay -->
    <div
      *ngIf="isSidebarVisible && !isDesktop"
      class="fixed inset-0 bg-black bg-opacity-40 z-30"
      (click)="toggleSidebar()"
    ></div>

    <!-- Sidebar -->
    <div
      class="fixed md:static top-0 left-0 h-full w-72 bg-white dark:bg-gray-800 shadow-lg z-40 transition-transform duration-300 ease-in-out"
      [ngClass]="{
        'translate-x-0': isSidebarVisible || isDesktop,
        '-translate-x-full': !isSidebarVisible && !isDesktop
      }"
    >
      <app-sidebar (closeSidebar)="onSidebarClose()" (logout)="logout()"></app-sidebar>
    </div>

    <!-- Main content area -->
    <div class="flex-1 flex flex-col overflow-hidden z-10 sm:ml-72 md:ml-2 lg:ml-2">
      <app-topbar (toggleSidebar)="toggleSidebar()" (logout)="logout()"></app-topbar>
      <main class="flex-1 overflow-y-auto p-4">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
