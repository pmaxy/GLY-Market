<div class="flex flex-col h-full w-full overflow-y-auto overflow-x-hidden scrollbar-hide bg-slate-50 dark:bg-slate-900">

  <div *ngFor="let category of groupedLists | keyvalue" class="py-4 px-2 sm:px-4 border-b border-slate-200 dark:border-slate-700">
    <!-- Category Title -->
    <h2 class="text-lg sm:text-xl font-semibold text-gray-100 dark:text-white mb-4 bg-primary-950 dark:bg-primary-800 p-3 ">
      {{ category.key }}
    </h2>

    <!-- Product Grid -->
    <div
      class="grid gap-4"
      [ngClass]="{
        'grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6': isMiniSidebarOpen,
        'grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4': !isMiniSidebarOpen
      }"
    >
      <!-- Product Card -->
      <div
        *ngFor="let list of category.value"
        class="bg-white dark:bg-gray-800 rounded-xl shadow-sm hover:shadow-md transition border border-slate-200 dark:border-slate-700 flex flex-col p-2 group cursor-pointer"
        (click)="openDialog(list)"
      >
        <!-- Image Section (¾ height) -->
        <div class="relative bg-primary-50 dark:bg-gray-700 rounded-md mb-2 aspect-[3/4] overflow-hidden flex items-center justify-center">
          <img
            [src]="list.src"
            [alt]="list.title"
            class="object-cover w-full h-full transition-transform duration-300 group-hover:scale-105"
            loading="lazy"
          />
          <span class="absolute top-1 right-1 text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 shadow border border-gray-200 dark:border-gray-600">
            {{ list.itemsLeft }} left
          </span>
        </div>

        <!-- Product Info -->
        <h3 class="text-sm font-semibold text-slate-900 dark:text-white truncate">{{ list.title }}</h3>
        <p class="text-xs text-primary-800 dark:text-primary-400 font-medium">Ksh. {{ list.price }}</p>

        <!-- Stock Progress Bar -->
        <!-- <div class="flex items-center justify-between gap-2 mt-2">
          <div class="relative flex-1 h-1.5 bg-zinc-200 dark:bg-zinc-700 rounded-full overflow-hidden">
            <div
              class="h-full transition-all duration-300"
              [ngClass]="{
                'bg-green-500': list.progressWidth > 50,
                'bg-yellow-500': list.progressWidth <= 50 && list.progressWidth > 20,
                'bg-red-500': list.progressWidth <= 20
              }"
              [style.width.%]="list.progressWidth"
            ></div>
            <div *ngIf="list.progressWidth > 15" class="absolute inset-0 flex items-center pl-1 text-white text-[10px] font-semibold">
              {{ list.progressWidth }}%
            </div>
          </div>
          <div *ngIf="list.progressWidth <= 15" class="text-[10px] text-gray-600 dark:text-gray-300 font-medium whitespace-nowrap ml-1">
            {{ list.progressWidth }}%
          </div>
        </div> -->

        <!-- Buttons -->
        <div class="mt-3 flex flex-col gap-1">
          <!-- <button
            class="px-3 py-1.5 text-xs font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded focus:outline-none focus:ring-1 focus:ring-primary-500 transition"
            (click)="addToCart(list); $event.stopPropagation()"
          >
            Add to Cart
          </button> -->
          <button
            class="px-3 py-1 text-xs font-medium text-primary-600 border border-primary-600 rounded hover:bg-primary-50 dark:hover:bg-gray-800 transition"
            (click)="openDialog(list); $event.stopPropagation()"
          >
            View Details
          </button>
        </div>

      </div>
    </div>
  </div>

</div>
