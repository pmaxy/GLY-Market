<div class="flex flex-col h-full w-full overflow-y-auto overflow-x-hidden scrollbar-hide">

  <!-- 🏷 Product Cards Grid -->
  <div
    class="grid gap-6 px-4 sm:px-6 py-6"
    [ngClass]="{
      'grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6': isMiniSidebarOpen,
      'grid-cols-3 sm:grid-cols-4 md:grid-cols-4 lg:grid-cols-4': !isMiniSidebarOpen
    }"
  >
    <button
      class="bg-white rounded-2xl shadow-md border border-primary-100 hover:shadow-lg hover:border-primary-300 transition p-4 flex flex-col justify-between w-full"
      role="article"
      *ngFor="let list of lists"
      (click)="openDialog(list)"
    >
      <!-- 🖼 Image with Stock Badge -->
      <div class="relative flex items-center justify-center bg-primary-50 rounded-lg mb-4 overflow-hidden p-3">
        <img
          [src]="list.src"
          [alt]="list.title"
          class="object-contain w-full aspect-[1.15]"
          loading="lazy"
        />
        <span
          class="absolute top-2 right-2 text-[10px] font-medium px-2 py-1 rounded-full bg-white text-gray-700 shadow border border-gray-200"
        >
          {{ list.itemsLeft }} left
        </span>
      </div>

      <!-- ✍️ Text Content -->
      <h2 class="text-base font-bold text-slate-800 truncate">{{ list.title }}</h2>
      <div class="mt-2 text-sm text-primary-800 font-medium">Ksh.{{ list.price }}</div>

      <!-- 📊 Progress Bar -->
<!-- 📊 Progress Bar -->
<!-- 📊 Stock Progress Display -->
<div class="flex items-center justify-between gap-2 mt-2">
  <!-- Progress Bar Container -->
  <div class="relative flex-1 h-2 bg-zinc-200 dark:bg-zinc-700 rounded-full overflow-hidden">
    <!-- Inner Progress Bar -->
    <div
      class="h-full transition-all duration-300"
      [ngClass]="{
        'bg-green-500': list.progressWidth > 50,
        'bg-yellow-500': list.progressWidth <= 50 && list.progressWidth > 20,
        'bg-red-500': list.progressWidth <= 20
      }"
      [style.width.%]="list.progressWidth"
    ></div>

    <!-- Floating Quantity Number (only if width > 15%) -->
    <div
      *ngIf="list.progressWidth > 15"
      class="absolute inset-0 flex items-center pl-2 text-white text-xs font-semibold"
    >
      
    </div>
  </div>

  <!-- Outside Label if progress is too small -->
  <div
    *ngIf="list.progressWidth <= 15"
    class="text-xs text-gray-600 dark:text-gray-300 font-medium whitespace-nowrap ml-2"
  >
    
  </div>
</div>



      <!-- 🛒 Add to Cart Button -->
      <button
        class="mt-5 px-5 py-3 text-sm font-semibold text-white bg-primary-700 hover:bg-primary-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-600 focus:ring-offset-2 transition"
        (click)="addToCart(list)"
      >
        Add to Cart
      </button>
    </button>
  </div>
</div>
