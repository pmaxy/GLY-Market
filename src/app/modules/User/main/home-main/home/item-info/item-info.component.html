<div class="w-full h-full overflow-auto   p-2 bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 scrollbar-hide ">
  <div class="w-full max-w-4xl mx-auto p-3 bg-white dark:bg-gray-900   rounded-xl shadow-xl">
    <div class="flex flex-col md:flex-row gap-6">
      
      <!-- Product Image -->
      <div class="w-full md:w-1/2">
        <img
          [src]="data.src"
          alt="{{ data.title }}"
          class="w-full aspect-square object-contain rounded-lg bg-neutral-100 dark:bg-gray-800"
        />
        <div class="mt-4 text-sm text-primary-500 dark:text-primary-400">
          {{ data.itemsLeft }} items left
        </div>
        <div class="mt-2 w-full h-2 bg-zinc-300 dark:bg-zinc-700 rounded-full">
          <div
            class="h-full bg-primary-500 dark:bg-primary-400 rounded-full"
            [style.width.px]="data.progressWidth"
          ></div>
        </div>
      </div>

      <!-- Product Info -->
      <div class="w-full md:w-1/2 flex flex-col space-y-4">
        <h1 class="text-lg font-bold">{{ data.title }}</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400">Details about the product...</p>
        <div class="text-primary-500 dark:text-primary-400 font-semibold">Ksh. {{ data.price }}</div>

        <textarea
          [(ngModel)]="productState.notes"
          name="notes"
          placeholder="Add notes for your order"
          class="w-full px-4 py-2 rounded-lg bg-neutral-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 resize-none focus:ring-2 focus:ring-primary-500 dark:focus:ring-primary-400"
        ></textarea>

        <!-- Quantity Controls -->
        <div class="flex items-center gap-4">
          <button
            type="button"
            (click)="decrementQuantity()"
            class="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-700 text-black dark:text-white rounded-full border dark:border-gray-600"
          >
            −
          </button>
          <span>{{ productState.quantity }}</span>
          <button
            type="button"
            (click)="incrementQuantity()"
            class="w-8 h-8 flex items-center justify-center bg-white dark:bg-gray-700 text-black dark:text-white rounded-full border dark:border-gray-600"
          >
            +
          </button>
        </div>

        <button
          type="submit"
          (click)="onSubmit()"
          class="w-full py-3 text-white bg-primary-900 hover:bg-primary-800 font-semibold rounded-lg"
        >
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>
