<div>
  <div class="bg-white dark:bg-gray-900 shadow-lg h-full flex flex-col p-4 rounded-lg" [class.hidden]="!isOpen">
    <!-- 🧑‍💼 Profile + Brand -->

    <div class="bg-primary-950 dark:bg-primary-800 p-4 rounded-xl w-full text-white mb-6 shadow-sm">
      <div class="flex items-center gap-4">
        <img loading="lazy" class="w-12 h-12 rounded-full border-2 border-primary-500 shadow"
          src="https://i.pravatar.cc/300" alt="User profile" />
        <div>
          <p class="text-sm font-semibold">Hi, User</p>
          <p class="text-xs text-gray-300">Welcome back!</p>
        </div>
      </div>
      <div class="mt-4 pt-2 border-t border-primary-800">
        <p class="text-lg font-bold text-primary-400 tracking-widest">AAI+</p>
      </div>
    </div>

    <!-- 🔍 Search -->
    <div class="mb-5 md:hidden">
      <input type="text" placeholder="🔎 Search..."
        class="w-full px-4 py-2 rounded-md border border-primary-200 dark:border-gray-700 bg-primary-50 dark:bg-gray-800 text-sm text-gray-800 dark:text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
    </div>

    <!-- 📂 Navigation -->
    <nav class="flex-1 space-y-2 text-sm font-medium text-gray-700 dark:text-gray-300">
      <a [routerLink]="['home']" (click)="onNavigate()"
        class="flex shadow-lg bg-primary-100 dark:bg-gray-800 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-white">
        <fa-icon [icon]="faHome" class="text-blue-500 w-5 h-5"></fa-icon>
        Home
      </a>
      <a [routerLink]="['dashboard']" (click)="onNavigate()"
        class="flex shadow-lg bg-primary-100 dark:bg-gray-800 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-white">
        <fa-icon [icon]="faDashboard" class="text-teal-500 w-5 h-5"></fa-icon>
        Dashboard
      </a>
      <a [routerLink]="['products']" (click)="onNavigate()"
        class="flex shadow-lg bg-primary-100 dark:bg-gray-800 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-white">
        <fa-icon [icon]="faProducts" class="text-pink-500 w-5 h-5"></fa-icon>
        Products
      </a>
      <a [routerLink]="['settings']" (click)="onNavigate()"
        class="flex shadow-lg bg-primary-100 dark:bg-gray-800 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-white">
        <fa-icon [icon]="faSettings" class="text-gray-600 w-5 h-5"></fa-icon>
        Settings
      </a>
    </nav>

    <!-- ⚙️ Bottom Settings / Profile / Logout -->
    <div
      class="mt-auto pt-4 border-t border-primary-100 dark:border-gray-700 space-y-2 text-sm text-gray-700 dark:text-gray-300">
      <a [routerLink]="['profile']" (click)="onNavigate()"
        class="flex shadow-lg bg-primary-100 dark:bg-gray-800 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-white">
        <fa-icon [icon]="faProfile" class="text-primary-600 w-5 h-5"></fa-icon>
        My Profile
      </a>

      <a [routerLink]="['setting']" (click)="onNavigate()"
        class="flex shadow-lg bg-primary-100 dark:bg-gray-800 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 dark:hover:bg-gray-700 hover:text-primary-700 dark:hover:text-white">
        <fa-icon [icon]="faSettings" class="text-gray-700 w-5 h-5"></fa-icon>
        Settings
      </a>

          <!-- 🌗 Theme Toggle -->
    <div class="mb-4 flex justify-end">
      <button (click)="toggleTheme()"
        class="px-3 py-1 text-sm font-medium rounded border border-gray-300 text-gray-700 dark:text-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800">
        {{ themeService.currentTheme === 'dark' ? 'Light Mode' : 'Dark Mode' }}
      </button>
    </div>

      <button (click)="logout.emit()"
        class="mt-4 w-full flex items-center gap-3 text-red-600 hover:bg-red-100 dark:hover:bg-red-800 p-2 rounded-md transition text-left">
        <fa-icon [icon]="faLogout" class="w-5 h-5"></fa-icon>
        Logout
      </button>
    </div>
  </div>
</div>
