<div class="flex flex-col h-full overflow-y-auto scrollbar-hide px-4 pt-4 pb-6 bg-gray-50 dark:bg-gray-900 transition-colors">

  <!-- 🧾 Header -->
  <header class="flex items-center gap-4 p-4 rounded-xl bg-white shadow dark:bg-gray-800">
    <img src="https://i.pravatar.cc/300" class="w-14 h-14 rounded-full border-2 border-primary-500 shadow" alt="Customer" />
    <div>
      <h1 class="text-xl font-bold text-gray-800 dark:text-white">Pat's Order</h1>
      <p class="text-sm text-gray-500 dark:text-gray-300">Order #005</p>
    </div>
  </header>

  <!-- 🏷️ Counter Info -->
  <div class="mt-4 p-4 bg-gradient-to-r from-primary-50 to-primary-100 border border-primary-200 rounded-xl flex justify-between items-center shadow-sm">
    <span class="text-lg font-semibold text-primary-800">Counter No</span>
    <img src="counter-icon.png" class="w-5 h-5" alt="Counter Icon" />
  </div>

  <!-- 🍔 Order Items -->
  <ng-container *ngFor="let item of orderItems">
    <section class="mt-4 p-4 bg-white rounded-xl shadow-sm flex items-start gap-4 dark:bg-gray-800">
      <img [src]="item.src" class="w-20 h-20 object-cover rounded-lg shadow-md" alt="{{ item.title }}" />
      <div class="flex flex-col flex-1">
        <div class="text-md font-semibold text-gray-800 dark:text-white truncate">{{ item.title }}</div>
        <div class="text-sm text-gray-500 dark:text-gray-300">ksh. {{ item.price }}</div>
        <div class="flex items-center gap-3 mt-3">
          <button
            (click)="updateItemQuantity(item, false)"
            class="w-8 h-8 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 rounded-full text-xl font-bold text-gray-800 dark:text-white flex items-center justify-center shadow-sm"
            aria-label="Decrease quantity">-</button>
          <span class="text-base text-gray-800 dark:text-white">{{ item.quantity }}</span>
          <button
            (click)="updateItemQuantity(item, true)"
            class="w-8 h-8 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 rounded-full text-xl font-bold text-gray-800 dark:text-white flex items-center justify-center shadow-sm"
            aria-label="Increase quantity">+</button>
        </div>
      </div>
    </section>
  </ng-container>

  <!-- 📊 Order Summary -->
  <section class="mt-6 p-5 bg-white rounded-xl shadow-sm dark:bg-gray-800">
    <div class="flex justify-between text-gray-700 dark:text-gray-100">
      <span>Subtotal</span>
      <span>{{ getSubtotal() }}</span>
    </div>
    <div class="flex justify-between mt-2 text-gray-500 dark:text-gray-300">
      <span>Tax (10%)</span>
      <span>{{ getTax() }}</span>
    </div>
    <div class="flex justify-between mt-2 text-gray-500 dark:text-gray-300">
      <span>Discount</span>
      <span>{{ getDiscount() }}</span>
    </div>
    <hr class="my-4 border-gray-300 dark:border-gray-700" />
    <div class="flex justify-between text-lg font-bold text-gray-800 dark:text-white">
      <span>Total</span>
      <span>{{ getTotal() }}</span>
    </div>
  </section>

  <!-- ✅ Place Order Button -->
  <button
    class="mt-6 bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 dark:focus:ring-primary-600 transition text-white py-3 rounded-xl text-lg font-semibold shadow-lg w-full">
    Place Order
  </button>

</div>
