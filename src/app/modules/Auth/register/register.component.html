<!-- Loading Overlay -->
<div class="loading-overlay fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center" *ngIf="isLoading" [class.active]="isLoading">
  <app-spinner></app-spinner>
</div>

<!-- Main Page Container -->
<div class="relative min-h-screen w-full bg-gradient-to-br from-primary-950 via-primary-900 to-primary-800 overflow-hidden">

  <!-- Background Leaves -->
  <section class="absolute inset-0 z-0 pointer-events-none">
    <div class="leaf">
      <div class="absolute w-full h-full">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 85%" src="/assets/figma-photos/Autumn-Fall-Leaves-Clip-Art-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 30%" src="/assets/figma-photos/Fall-Autumn-Leaves-Transparent-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 15%" src="/assets/figma-photos/Green-Leaves-PNG-File.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 90%" src="/assets/figma-photos/Green-Leaves-PNG-File.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 5%" src="/assets/figma-photos/Realistic-Autumn-Fall-Leaves-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 10%" src="/assets/figma-photos/Fall-Autumn-Leaves-Transparent-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 25%" src="/assets/figma-photos/Autumn-Fall-Leaves-Clip-Art-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 35%" src="/assets/figma-photos/Transparent-Autumn-Leaves-Falling-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 45%" src="/assets/figma-photos/Fall-Autumn-Leaves-Transparent-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 55%" src="/assets/figma-photos/Autumn-Fall-Leaves-Clip-Art-PNG.png" alt="Leaf">
        <img class="animate-fall absolute w-16 h-16 opacity-70" style="left: 60%" src="/assets/figma-photos/Green-Leaves-PNG-File.png" alt="Leaf">
      </div>
    </div>
  </section>

  <!-- Registration Form Container -->
  <div class="relative z-10 flex items-center justify-center min-h-screen px-4 py-16">
    <div class="w-full max-w-md p-8 space-y-6 bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 text-white">
      <h2 class="text-3xl font-bold text-center">Create an account</h2>

      <!-- Error Message Block -->
      <div *ngIf="errorMsg.length" class="bg-red-100 text-red-700 p-3 rounded-md text-sm space-y-1">
        <p *ngFor="let msg of errorMsg">{{ msg }}</p>
      </div>

      <!-- Registration Form -->
      <form (ngSubmit)="register()" #registerForm="ngForm" novalidate class="space-y-4">

        <div>
          <label for="firstname" class="block mb-2 text-sm font-medium">First Name</label>
          <input [(ngModel)]="registerRequest.firstname" name="firstname" id="firstname" type="text" required placeholder="First Name"
            class="w-full px-4 py-2 bg-white/10 border border-white/20 text-white rounded-lg focus:ring-2 focus:ring-primary-400">
        </div>

        <div>
          <label for="lastname" class="block mb-2 text-sm font-medium">Last Name</label>
          <input [(ngModel)]="registerRequest.lastname" name="lastname" id="lastname" type="text" required placeholder="Last Name"
            class="w-full px-4 py-2 bg-white/10 border border-white/20 text-white rounded-lg focus:ring-2 focus:ring-primary-400">
        </div>

        <div>
          <label for="email" class="block mb-2 text-sm font-medium">Email</label>
          <input [(ngModel)]="registerRequest.email" name="email" id="email" type="email" required placeholder="you@example.com"
            class="w-full px-4 py-2 bg-white/10 border border-white/20 text-white rounded-lg focus:ring-2 focus:ring-primary-400">
        </div>

        <div>
          <label for="password" class="block mb-2 text-sm font-medium">Password</label>
          <input [(ngModel)]="registerRequest.password" name="password" id="password" type="password" required placeholder="••••••••"
            class="w-full px-4 py-2 bg-white/10 border border-white/20 text-white rounded-lg focus:ring-2 focus:ring-primary-400">
        </div>

        <div>
          <label for="role" class="block mb-2 text-sm font-medium">Role</label>
          <input [(ngModel)]="registerRequest.role" name="role" id="role" type="text" required placeholder="ADMIN"
            class="w-full px-4 py-2 bg-white/10 border border-white/20 text-white rounded-lg focus:ring-2 focus:ring-primary-400">
        </div>

        <div class="flex items-start space-x-2">
          <input id="terms" type="checkbox" required class="w-4 h-4 mt-1 rounded border-white/30 bg-white/10 focus:ring-2 focus:ring-primary-400">
          <label for="terms" class="text-sm">I accept the
            <a href="#" class="text-primary-400 hover:underline">Terms and Conditions</a>
          </label>
        </div>

        <button type="submit" class="w-full py-3 btn1">
          Create Account
        </button>
      </form>

      <!-- Login Redirect -->
      <p class="text-sm text-center text-gray-300">
        Already have an account?
        <button (click)="login()" class="text-primary-400 hover:underline ml-1">Login here</button>
      </p>
    </div>
  </div>
</div>
