<!-- Loading Spinner Overlay -->
<div class="loading-overlay fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center" *ngIf="isLoading" [class.active]="isLoading">
  <app-spinner></app-spinner>
</div>

<!-- Main Container with Fall Leaves Background -->
<div class="relative h-screen w-screen bg-primary-950 overflow-hidden">

  <!-- Animated Falling Leaves Background -->
  <section class="absolute top-0 left-0 w-full h-full z-10 pointer-events-none bg-primary-950/50">
    <div class="leaf absolute w-full h-full">
      <img *ngFor="let leaf of leafImages; let i = index"
        [src]="leaf"
        class="animate-fall absolute w-16 h-16 opacity-70 "
        [ngStyle]="{ left: leafPositions[i] }"
        alt="Leaf" />
    </div>
  </section>

  <!-- Login Form Section -->
  <div class="relative z-10 flex items-center justify-center h-full px-4">
    <div class="w-full max-w-md p-8 bg-white/10 backdrop-blur-md rounded-2xl shadow-lg border border-white/20 text-white">

      <h1 class="text-2xl font-bold text-center text-primary-200 mb-6">Sign in to your account</h1>

      <!-- Error Messages -->
      <div *ngIf="errorMsg.length" class="bg-red-100 text-red-800 p-3 rounded-md mb-4 text-sm space-y-1">
        <p *ngFor="let msg of errorMsg">{{ msg }}</p>
      </div>

      <!-- Login Form -->
      <form class="space-y-4" (ngSubmit)="login()">
        <div>
          <label for="email" class="block mb-2 text-sm font-medium">Email</label>
          <input [(ngModel)]="authRequest.email" name="email" id="email" type="email" required placeholder="example@email.com"
            class="w-full p-3 rounded-md bg-white/10 text-white border border-white/20 focus:ring-2 focus:ring-primary-400">
        </div>

        <div>
          <label for="password" class="block mb-2 text-sm font-medium">Password</label>
          <input [(ngModel)]="authRequest.password" name="password" id="password" type="password" required placeholder="••••••••"
            class="w-full p-3 rounded-md bg-white/10 text-white border border-white/20 focus:ring-2 focus:ring-primary-400">
        </div>

        <button type="submit" class="w-full py-3 btn1">
          Sign in
        </button>

        <div class="text-sm text-center text-white mt-4">
          Don't have an account?
          <button type="button" (click)="register()" class="text-primary-400 hover:underline ml-1">Register</button>
        </div>
      </form>
    </div>
  </div>
  <div class="absolute bottom-0 left-0 w-full top-0 z-0 pointer-events-none ">
    <img src="/assets/figma-photos/water-wave5.svg" alt="Wave Edge" class="w-full h-full  object-cover" />
  </div>
</div>
