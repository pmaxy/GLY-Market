<div
  class="w-72 bg-white shadow-xl h-full flex flex-col p-4 rounded-xl border overflow-y-auto scrollbar-hide border-gray-200">

  <!-- 🌍 User Info -->
  <div class="bg-primary-950 p-4 rounded-lg text-white mb-6 shadow-sm">
    <div class="flex items-center gap-4">
      <img src="https://i.pravatar.cc/300" alt="User profile photo"
        class="w-12 h-12 rounded-full border-2 border-primary-500" />
      <div>
        <p class="text-sm font-semibold">Hi, GeoUser</p>
        <p class="text-xs text-gray-300">Spatial Intelligence</p>
      </div>
    </div>
    <p class="mt-4 pt-3 border-t border-primary-800 text-lg font-bold text-primary-400">GeoDashboard</p>
  </div>

  <!-- 🧭 Navigation -->
  <nav class="space-y-2 text-sm font-medium text-gray-800">
    <a [routerLink]="['geodata']" routerLinkActive="text-primary-700"
    (click)="onNavigate()"
      (click)="onNavigate()" class="flex items-center  gap-3 bg-primary-50 hover:bg-primary-100 p-2 rounded-md  transition">
      <fa-icon [icon]="faMap" class="text-blue-600 w-5 h-5"></fa-icon>
      Maps & Data
    </a>
    <a [routerLink]="['geoplanning']" routerLinkActive="text-primary-700"
      (click)="onNavigate()" class="flex items-center  gap-3 bg-primary-50 hover:bg-primary-100 p-2 rounded-md  transition">
      <fa-icon [icon]="faDraftingCompass" class="text-purple-600 w-5 h-5"></fa-icon>
      Planning Tools
    </a>
    <a [routerLink]="['geoanalytics']" routerLinkActive="text-primary-700"
      (click)="onNavigate()" class="flex items-center  gap-3 bg-primary-50 hover:bg-primary-100 p-2 rounded-md  transition">
      <fa-icon [icon]="faChartBar" class="text-orange-500 w-5 h-5"></fa-icon>
      Analytics
    </a>
    <a [routerLink]="['georeports']" routerLinkActive="text-primary-700"
      (click)="onNavigate()" class="flex items-center  gap-3 bg-primary-50 hover:bg-primary-100 p-2 rounded-md  transition">
      <fa-icon [icon]="faFileAlt" class="text-teal-600 w-5 h-5"></fa-icon>
      Reports
    </a>
    <a [routerLink]="['profile']"
      (click)="onNavigate()" class="flex items-center  gap-3 p-2 rounded-md bg-primary-50 hover:bg-primary-100 text-primary-700 transition">
      <fa-icon [icon]="faUserCircle" class="w-5 h-5"></fa-icon>
      My Profile
    </a>
    <a [routerLink]="['setting']"
     (click)="onNavigate()" class="flex items-center gap-3 p-2 rounded-md bg-primary-50 hover:bg-primary-100 text-gray-700 transition">
      <fa-icon [icon]="faCog" class="w-5 h-5"></fa-icon>
      Settings
    </a>
  </nav>

  <!-- 🗺️ Map Layers -->
  <div class="mt-6">
    <p class="text-xs font-semibold text-gray-500 uppercase mb-2">Map Layers</p>
    <div class="space-y-2 text-sm text-gray-700">
      <label class="flex items-center gap-2">
        <input type="checkbox" [(ngModel)]="layers.roads" class="accent-primary-600" />
        Roads & Highways
      </label>
      <label class="flex items-center gap-2">
        <input type="checkbox" [(ngModel)]="layers.population" class="accent-primary-600" />
        Population Density
      </label>
      <label class="flex items-center gap-2">
        <input type="checkbox" [(ngModel)]="layers.terrain" class="accent-primary-600" />
        Terrain / Elevation
      </label>
    </div>
  </div>

  <!-- 🧭 Basemap Switcher -->
  <div class="mt-6">
    <p class="text-xs font-semibold text-gray-500 uppercase mb-2">Basemap</p>
    <select [(ngModel)]="selectedBasemap"
      class="w-full p-2 rounded-md border border-gray-300 bg-white text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      <option value="streets">Streets</option>
      <option value="satellite">Satellite</option>
      <option value="topo">Topographic</option>
    </select>
  </div>

  <!-- ⚙️ Footer Actions -->
  <div class="mt-auto pt-6 border-t border-gray-200 space-y-2 text-sm">

    <button (click)="logout.emit()"
      class="w-full flex items-center gap-3 text-red-600 hover:bg-red-100 p-2 rounded-md transition text-left">
      <fa-icon [icon]="faRightFromBracket" class="w-5 h-5"></fa-icon>
      Logout
    </button>
  </div>
</div>
