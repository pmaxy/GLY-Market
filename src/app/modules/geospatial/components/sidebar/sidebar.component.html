<div [ngClass]="theme">
  <div class=" w-52 h-full flex flex-col p-4 rounded-xl shadow-xl overflow-y-auto scrollbar-hide border border-gray-200 bg-white text-gray-900 
           dark:bg-gray-900 dark:text-white dark:border-gray-700">



    <!-- 🌍 User Info -->
    <div class=" bg-primary-950 p-4 rounded-lg dark:bg-primary-800  text-white mb-6 dark:bg-primary-800  shadow-sm">
      <div class="flex items-center gap-4">
        <img src="https://i.pravatar.cc/300" alt="User profile photo"
          class="w-12 h-12 rounded-full border-2 border-primary-500" />
        <div>
          <p class="text-sm font-semibold">Hi, GeoUser</p>
          <p class="text-xs text-gray-300">Spatial Intelligence</p>
        </div>
      </div>
      <p class="mt-4 pt-3 border-t border-primary-800 text-lg font-bold text-primary-400">GeoDashboard</p>
    </div>

    <!-- 🧭 Navigation -->
    <nav class="space-y-2 text-sm font-medium">
      <ng-container *ngFor="let link of navLinks">
        <a [routerLink]="[link.route]" routerLinkActive="text-primary-700" (click)="onNavigate()" class="flex items-center gap-3 p-2 rounded-md transition
                  bg-primary-50 hover:bg-primary-100
                  dark:bg-gray-800 dark:hover:bg-gray-700">
          <fa-icon [icon]="link.icon" class="w-5 h-5" [ngClass]="link.iconColor"></fa-icon>
          {{ link.label }}
        </a>
      </ng-container>
    </nav>
    <!-- 🌗 Theme Toggle -->
    <div class="m-4 flex justify-end ">
      <button (click)="toggleTheme()"
        class="px-3 py-1 text-sm font-medium rounded border border-gray-300 text-gray-700 dark:text-gray-200 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800">
        {{ themeService.currentTheme === 'dark' ? 'Light Mode' : 'Dark Mode' }}
      </button>
    </div>

    <!-- 🗺️ Map Layers -->
    <div class="mt-6">
      <p class="text-xs font-semibold uppercase mb-2 text-gray-500 dark:text-gray-400">Map Layers</p>
      <div class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
        <label class="flex items-center gap-2">
          <input type="checkbox" [(ngModel)]="layers.roads" class="accent-primary-600" />
          Roads & Highways
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" [(ngModel)]="layers.population" class="accent-primary-600" />
          Population Density
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" [(ngModel)]="layers.terrain" class="accent-primary-600" />
          Terrain / Elevation
        </label>
      </div>
    </div>

    <!-- 🧭 Basemap Switcher -->
    <div class="mt-6">
      <p class="text-xs font-semibold uppercase mb-2 text-gray-500 dark:text-gray-400">Basemap</p>
      <select [(ngModel)]="selectedBasemap" class="w-full p-2 rounded-md border text-sm shadow-sm
                     border-gray-300 dark:border-gray-600
                     bg-white dark:bg-gray-800
                     focus:outline-none focus:ring-2 focus:ring-primary-500">
        <option value="streets">Streets</option>
        <option value="satellite">Satellite</option>
        <option value="topo">Topographic</option>
      </select>
    </div>

    <!-- ⚙️ Footer Actions -->
    <div class="mt-auto pt-6 border-t space-y-2 text-sm border-gray-200 dark:border-gray-700">
      <button (click)="logout.emit()"
        class="w-full flex items-center gap-3 text-red-600 hover:bg-red-100 dark:hover:bg-red-900 p-2 rounded-md transition text-left">
        <fa-icon [icon]="faRightFromBracket" class="w-5 h-5"></fa-icon>
        Logout
      </button>
    </div>
  </div>
</div>
