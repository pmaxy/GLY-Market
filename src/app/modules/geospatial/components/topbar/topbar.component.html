<div class="w-full bg-primary-950 px-4 sm:px-6 py-3 shadow-md border-b border-primary-800 flex items-center justify-between gap-4 flex-nowrap">
  
    <!-- 🔗 Brand & Sidebar Toggle (Left) -->
    <div class="flex items-center space-x-2">
      <!-- Hamburger button for both desktop and mobile -->
      <button
        (click)="toggleSidebar.emit()"  
        class="p-2 rounded-md hover:bg-primary-800 transition-colors"
        aria-label="Toggle Sidebar"
      >
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h1 class="text-xl font-bold tracking-wide text-primary-400">AAI+ Community</h1>
    </div>
    
      
      <!-- 🔍 Search (Center) -->
      <div class="hidden md:flex items-center w-full max-w-md">
        <div class="flex items-center w-full bg-primary-900 rounded-md overflow-hidden border border-primary-700">
          <input
            type="text"
            placeholder="Search..."
            class="w-full px-4 py-2 text-sm text-white placeholder-gray-400 bg-transparent focus:outline-none focus:ring-2 focus:ring-primary-500"
          />
          <button class="p-2 text-gray-300 hover:bg-primary-800 transition" aria-label="Search">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z" />
            </svg>
          </button>
        </div>
      </div>
    
      <!-- 🧑‍💼 Profile Actions (Right) -->
      <div class="flex items-center space-x-2 ml-auto relative" (clickOutside)="closeDropdown()">
        <button
          class="flex items-center space-x-2 p-2 text-white hover:bg-primary-800 rounded-md transition"
          (click)="toggleDropdown()"
        >
          <img class="w-8 h-8 rounded-full border border-primary-700 object-cover" src="https://i.pravatar.cc/300" alt="Profile" />
          <span class="hidden sm:block text-sm font-medium">Hi, User</span>
          <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
    
        <!-- 🧾 Dropdown -->
        <div *ngIf="isDropdownOpen"
             class="absolute right-0 top-12 w-48 bg-white border border-gray-200 rounded-md shadow-md z-50">
          <a routerLink="/user/profile"
             class="block px-4 py-2 text-gray-700 hover:bg-primary-600 hover:text-white focus:outline-none">
            My Profile
          </a>
          <a routerLink="/user/settings"
             class="block px-4 py-2 text-gray-700 hover:bg-primary-600 hover:text-white focus:outline-none">
            Settings
          </a>
          <button (click)="logout()"
             class="w-full text-left px-4 py-2 text-gray-700 hover:bg-red-100 hover:text-red-600 focus:outline-none">
            Logout
          </button>
        </div>
      </div>
    </div>
