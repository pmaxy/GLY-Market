<!-- planning.component.html -->
<div class="space-y-6">
    <h2 class="text-2xl font-bold">Geospatial Planning Tools</h2>
  
    <div class="bg-white p-4 rounded-md shadow-md">
      <h3 class="font-semibold">Climate Impact Planning</h3>
      <p class="text-sm">Visualize and plan for climate change impacts in your region.</p>
      <button class="mt-4 bg-primary-800 text-white p-2 rounded-md hover:bg-primary-700" (click)="startClimatePlanning()">
        Start Planning
      </button>
    </div>
  
    <div class="bg-white p-4 rounded-md shadow-md">
      <h3 class="font-semibold">Urban Development Zones</h3>
      <p class="text-sm">Create urban zones for sustainable city planning.</p>
      <button class="mt-4 bg-primary-800 text-white p-2 rounded-md hover:bg-primary-700" (click)="startUrbanPlanning()">
        Start Planning
      </button>
    </div>
  </div>
