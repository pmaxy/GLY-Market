<div class="space-y-6">
  <h2 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Geospatial Planning Tools</h2>

  <!-- Climate Impact Planning -->
  <div class="bg-white dark:bg-gray-800 p-4 rounded-md shadow-md">
    <h3 class="font-semibold text-gray-900 dark:text-gray-100">Climate Impact Planning</h3>
    <p class="text-sm text-gray-700 dark:text-gray-300">Visualize and plan for climate change impacts in your region.</p>
    <button class="mt-4 bg-primary-800 text-white p-2 rounded-md hover:bg-primary-700 dark:hover:bg-primary-600" (click)="startClimatePlanning()">
      Start Planning
    </button>
  </div>

  <!-- Urban Development Zones -->
  <div class="bg-white dark:bg-gray-800 p-4 rounded-md shadow-md">
    <h3 class="font-semibold text-gray-900 dark:text-gray-100">Urban Development Zones</h3>
    <p class="text-sm text-gray-700 dark:text-gray-300">Create urban zones for sustainable city planning.</p>
    <button class="mt-4 bg-primary-800 text-white p-2 rounded-md hover:bg-primary-700 dark:hover:bg-primary-600" (click)="startUrbanPlanning()">
      Start Planning
    </button>
  </div>
</div>
