<div class="w-full h-full flex flex-col">
  <!-- 🗺️ Map Container -->
  <div class="relative w-full h-[95vh] bg-gray-100 shadow-lg overflow-hidden">
    <div id="map" class="w-full h-full z-0"></div>

    <!-- 📍 Coordinates Display -->
    <div class="absolute bottom-4 left-4 bg-white bg-opacity-90 rounded px-4 py-2 text-sm shadow z-10">
      <p>Lat: {{ lat.toFixed(5) }}, Lng: {{ lng.toFixed(5) }}</p>
    </div>
  </div>

  <!-- 🎛️ Controls Panel -->
  <div class="p-2 bg-white dark:bg-gray-800 flex flex-wrap gap-2 justify-start items-center">
    <h2 class="text-lg font-semibold text-gray-700 dark:text-white mr-2">🧭 Map Controls:</h2>

    <button
      class="bg-gray-700 text-white px-4 py-1 rounded hover:bg-gray-600 transition"
      (click)="resetMap()">
      🔄 Reset Map
    </button>

    <button
      class="bg-green-600 text-white px-4 py-1 rounded hover:bg-green-500 transition"
      (click)="toggleLayer('vegetation')">
      🌿 Vegetation
    </button>
    <button
      class="bg-red-600 text-white px-4 py-1 rounded hover:bg-red-500 transition"
      (click)="toggleLayer('riskZones')">
      ⚠️ Risk Zones
    </button>
    <button
      class="bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-500 transition"
      (click)="toggleLayer('urbanPlanning')">
      🏙️ Urban Planning
    </button>
  </div>
</div>
