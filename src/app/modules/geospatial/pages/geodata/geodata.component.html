<div class="w-full h-full flex flex-col space-y-6">
  <!-- 🗺️ Map Container -->
  <div class="w-full h-[70vh] rounded-xl overflow-hidden shadow-lg relative bg-gray-100">
    <div id="map" class="w-screen h-[70vh] "></div>

    <!-- 🧭 Scale & Coordinates Display -->
    <div class="absolute bottom-4 left-4 bg-white bg-opacity-90 rounded-md px-4 py-2 text-xs shadow">
      <p>Lat: {{ lat.toFixed(5) }}, Lng: {{ lng.toFixed(5) }}</p>
    </div>
  </div>

  <!-- 🎛️ Controls Panel -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <h2 class="text-2xl font-bold text-primary-800 dark:text-primary-200 ">Explore Geospatial Layers</h2>
    <div class="flex gap-2 flex-wrap">
      <button 
        class="bg-primary-800 text-white px-4 py-2 rounded-md hover:bg-primary-700 transition"
        (click)="resetMap()">
        🔄 Reset Map
      </button>
      <button 
        class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-500 transition"
        (click)="toggleLayer('vegetation')">
        🌿 Vegetation Layer
      </button>
      <button 
        class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-500 transition"
        (click)="toggleLayer('riskZones')">
        ⚠️ Risk Zones Layer
      </button>
      <button 
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-500 transition"
        (click)="toggleLayer('urbanPlanning')">
        🏙️ Urban Planning
      </button>
    </div>
  </div>
</div>
