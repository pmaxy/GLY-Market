<div class="space-y-6 text-gray-800 dark:text-gray-100">
  <h2 class="text-2xl font-bold dark:text-white">Geospatial Reports</h2>

  <div *ngFor="let report of reports" class="bg-white dark:bg-gray-900 p-4 rounded-md shadow-md">
    <h3 class="font-semibold dark:text-primary-400">{{ report.title }}</h3>
    <p class="text-sm dark:text-gray-400">{{ report.description }}</p>
    <button class="mt-2 text-primary-600 hover:underline dark:text-primary-400 hover:underline"
      routerLink="/report/{{ report.id }}">Download Report</button>
  </div>
</div>
