<!-- reports.component.html -->
<div class="space-y-6">
    <h2 class="text-2xl font-bold">Geospatial Reports</h2>
    <div *ngFor="let report of reports" class="bg-white p-4 rounded-md shadow-md">
      <h3 class="font-semibold">{{ report.title }}</h3>
      <p class="text-sm">{{ report.description }}</p>
      <button class="mt-2 text-primary-600 hover:underline" routerLink="/report/{{ report.id }}">Download Report</button>
    </div>
  </div>
