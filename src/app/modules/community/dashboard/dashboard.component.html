<!-- 🔄 Loading Overlay -->
<div [ngClass]="themeClass" class="min-h-screen">

<div class="loading-overlay fixed inset-0 flex items-center justify-center bg-white/70 dark:bg-black/70 z-50" 
     *ngIf="isLoading" 
     [class.active]="isLoading">
  <app-spinner></app-spinner>
</div>

<!-- 🌐 Main Layout Wrapper -->
<div class="flex flex-col md:flex-row h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 relative">

  <!-- 🕶️ Overlay (for mobile sidebar) -->
  <div
    *ngIf="isSidebarVisible && !isDesktop"
    class="fixed inset-0 bg-black bg-opacity-40 z-30"
    (click)="toggleSidebar()"
  ></div>

  <!-- 🧭 Sidebar -->
  <div
    class="fixed md:static top-0 left-0 h-full w-52 bg-white dark:bg-gray-800 shadow-lg dark:shadow-black z-40 transition-transform duration-300 ease-in-out overflow-y-auto scrollbar-hide"
    [ngClass]="{
      'translate-x-0': isSidebarVisible || isDesktop,
      '-translate-x-full': !isSidebarVisible && !isDesktop
    }"
  >
    <app-sidebar
      (closeSidebar)="onSidebarClose()"
      (logout)="logout()"
    ></app-sidebar>
  </div>

  <!-- 📄 Main Content Area -->
  <div class=" flex-1 flex flex-col  z-10 sm:ml-52 md:ml-2 lg:ml-2  ">
    <app-topbar class="sticky top-0 z-10" (toggleSidebar)="toggleSidebar()" (logout)="logout()"></app-topbar>

    <main class="flex-1 overflow-y-auto scrollbar-hide z-0  p-4 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
</div>
