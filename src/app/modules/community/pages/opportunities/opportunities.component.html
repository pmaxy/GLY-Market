<section class="p-6 bg-gray-50 min-h-screen">
    <!-- Header Section -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-semibold text-gray-800">🌟 Explore Opportunities</h1>
      <button (click)="openDialog()"
              class="bg-primary-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-primary-700 transition duration-300">
        Post Opportunity
      </button>
    </div>
  
    <!-- Opportunities Grid -->
    <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let opp of opportunities" class="bg-primary-50 rounded-lg shadow-lg hover:shadow-xl transition duration-300 overflow-hidden">
        <img *ngIf="opp.imageUrl" [src]="opp.imageUrl" alt="{{ opp.title }}"
             class="w-full h-48 object-cover rounded-t-lg" />
        <div class="p-6">
          <p class="text-sm text-gray-500">{{ opp.postedOn }} | {{ opp.type }}</p>
          <h3 class="text-xl font-semibold text-gray-800 mt-2">{{ opp.title }}</h3>
          <p class="text-gray-600 mt-2">{{ opp.description }}</p>
          <span class="text-sm text-primary-600 font-medium mt-4 inline-block">📍 {{ opp.location }}</span>
        </div>
      </div>
    </div>
  </section>
