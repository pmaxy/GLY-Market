<section class="p-4 sm:p-6 bg-gray-50 dark:bg-gray-900 min-h-screen">
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
    <h1 class="text-2xl sm:text-3xl font-semibold text-gray-800 dark:text-white">🌟 Explore Opportunities</h1>
    <button (click)="openDialog()"
      class="w-full sm:w-auto bg-primary-600 text-white px-4 py-2 sm:px-6 sm:py-3 rounded-lg shadow-md hover:bg-primary-700 transition duration-300 active:scale-95">
      Post Opportunity
    </button>
  </div>

  <!-- Opportunities Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let opp of opportunities"
      class="bg-white dark:bg-gray-800  rounded-lg shadow-md hover:shadow-lg transition duration-300 overflow-hidden ">
      <div class="relative aspect-video overflow-hidden">
        <img *ngIf="opp.imageUrl" [src]="opp.imageUrl" alt="{{ opp.title }}"
          class="w-full h-full object-cover transition-transform duration-300 hover:scale-105" />
      </div>
      <div class="p-4 sm:p-6">
        <div class="flex items-center gap-2 text-xs sm:text-sm text-gray-500 dark:text-gray-400 mb-2">
          <span>{{ opp.postedOn }}</span>
          <span class="w-1 h-1 bg-gray-400 dark:bg-gray-500 rounded-full"></span>
          <span>{{ opp.type }}</span>
        </div>
        <h3 class="text-lg sm:text-xl font-semibold text-gray-800 dark:text-white line-clamp-2">{{ opp.title }}</h3>
        <p class="text-gray-600 dark:text-gray-300 mt-2 text-sm sm:text-base line-clamp-3">{{ opp.description }}</p>
        <div class="mt-4 flex items-center gap-1 text-sm text-primary-600 dark:text-primary-400 font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>{{ opp.location }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
