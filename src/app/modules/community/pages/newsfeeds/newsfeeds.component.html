<section class="p-6 bg-gray-50 min-h-screen">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-bold text-gray-800">📰 News & Announcements</h1>
      <p class="text-gray-600 mt-2">Stay updated with the latest in geospatial intelligence, drone tech, and environmental innovation.</p>
    </div>
  
    <div class="grid gap-6 sm:grid-cols-1 md:grid-cols-2">
      <div *ngFor="let news of newsList" class="flex flex-col md:flex-row bg-primary-50 shadow-md hover:shadow-lg rounded-lg overflow-hidden transition">
        <img [src]="news.imageUrl" alt="news thumbnail" class="w-full md:w-40 h-40 object-cover">
        <div class="p-4 flex flex-col justify-between">
          <div>
            <h2 class="text-xl font-semibold text-gray-800">{{ news.title }}</h2>
            <p class="text-sm text-gray-500 mb-2">{{ news.date }}</p>
            <p class="text-sm text-gray-700">{{ news.summary }}</p>
          </div>
          <a href="#" class="mt-4 text-primary-600 text-sm font-medium hover:underline self-start">Read More →</a>
        </div>
      </div>
    </div>
  </section>
