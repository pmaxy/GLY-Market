<div class="p-8 bg-gray-50 min-h-screen font-inter">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 flex items-center gap-2">
      <fa-icon [icon]="['fas', 'cog']" class="text-primary-500"></fa-icon>
      Account Settings
    </h1>
  
    <div class="grid gap-8">
  
      <!-- Profile -->
      <section class="bg-white shadow rounded-2xl p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">👤 Profile Information</h2>
        <div class="flex items-center gap-4 mb-6">
          <img [src]="user.avatar" alt="Avatar" class="w-20 h-20 rounded-full border-4 border-primary-200 shadow" />
          <div>
            <input type="file" (change)="onAvatarChange($event)" accept="image/*"
                   class="block text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-primary-100 file:text-primary-700 file:rounded-md hover:file:bg-primary-200" />
            <p class="text-xs mt-1 text-gray-400">PNG, JPG up to 2MB</p>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" [(ngModel)]="user.name" placeholder="Full Name" class="input-field" />
          <input type="email" [(ngModel)]="user.email" placeholder="Email" class="input-field" />
          <input type="tel" [(ngModel)]="user.phone" placeholder="Phone Number" class="input-field" />
          <input type="text" [(ngModel)]="user.location" placeholder="Location" class="input-field" />
        </div>
        <textarea [(ngModel)]="user.bio" placeholder="Your bio..." class="input-field mt-4"></textarea>
      </section>
  
      <!-- Social Media -->
      <section class="bg-white shadow rounded-2xl p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">🌐 Social Media</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <input type="url" [(ngModel)]="user.social.linkedin" placeholder="LinkedIn URL" class="input-field" />
          <input type="url" [(ngModel)]="user.social.twitter" placeholder="Twitter URL" class="input-field" />
          <input type="url" [(ngModel)]="user.social.github" placeholder="GitHub URL" class="input-field" />
        </div>
      </section>
  
      <!-- CV Upload -->
      <section class="bg-white shadow rounded-2xl p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">📄 CV Upload</h2>
        <input type="file" (change)="onCVUpload($event)" accept=".pdf,.doc,.docx"
               class="input-field bg-white file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-secondary-100 file:text-secondary-700 file:rounded-md hover:file:bg-secondary-200" />
        <div *ngIf="user.cv" class="mt-2 flex justify-between items-center text-sm text-gray-600">
          <span>Uploaded CV: {{ user.name }}</span>
          <button (click)="user.cv = null" class="text-red-600 hover:underline">Remove</button>
        </div>
      </section>
  
      <!-- Password Reset -->
      <section class="bg-white shadow rounded-2xl p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">🔐 Reset Password</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="password" [(ngModel)]="newPassword" placeholder="New Password" class="input-field" />
          <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm Password" class="input-field" />
        </div>
        <button class="btn-primary mt-4" (click)="resetPassword()">Reset Password</button>
      </section>
  
      <!-- Preferences -->
      <section class="bg-white shadow rounded-2xl p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">🎛️ Preferences</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-2 font-medium text-gray-600">Language</label>
            <select [(ngModel)]="selectedLanguage" class="input-field">
              <option value="en">English</option>
              <option value="sw">Swahili</option>
            </select>
          </div>
          <div>
            <label class="block mb-2 font-medium text-gray-600">Theme</label>
            <select [(ngModel)]="theme" class="input-field">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        </div>
        <div class="mt-4">
          <label class="flex items-center space-x-3">
            <input type="checkbox" [(ngModel)]="notifications.email" class="form-checkbox rounded text-primary-600" />
            <span>Email Notifications</span>
          </label>
          <label class="flex items-center space-x-3 mt-2">
            <input type="checkbox" [(ngModel)]="notifications.sms" class="form-checkbox rounded text-primary-600" />
            <span>SMS Notifications</span>
          </label>
        </div>
      </section>
  
      <div class="text-right">
        <button class="btn-primary" (click)="saveSettings()">💾 Save Settings</button>
      </div>
  
    </div>
  </div>
