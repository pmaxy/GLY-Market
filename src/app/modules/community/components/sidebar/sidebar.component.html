<div class="w-64 bg-white shadow-lg h-full flex flex-col p-4 rounded-lg">

    <!-- 🧑‍💼 Profile + Brand -->
    <div class="bg-primary-950 p-4 rounded-xl w-full text-white mb-6 shadow-sm">
      <div class="flex items-center gap-4">
        <img loading="lazy"
             class="w-12 h-12 rounded-full border-2 border-primary-500 shadow"
             src="https://i.pravatar.cc/300"
             alt="User profile" />
        <div>
          <p class="text-sm font-semibold">Hi, User</p>
          <p class="text-xs text-gray-300">Welcome back!</p>
        </div>
      </div>
      <div class="mt-4 pt-2 border-t border-primary-800">
        <p class="text-lg font-bold text-primary-400 tracking-widest">AAI+</p>
      </div>
    </div>
  
    <!-- 🔍 Search -->
    <div class="mb-5">
      <input type="text" placeholder="🔎 Search..."
        class="w-full px-4 py-2 rounded-md border border-primary-200 bg-primary-50 text-sm text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
    </div>
  
    <!-- 📂 Navigation -->
    <nav class="flex-1 space-y-2 text-sm font-medium text-gray-700">
      <a [routerLink]="['chat']" routerLinkActive=" text-primary-700 "
         class="flex shadow-lg bg-primary-100 items-center  gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
         <fa-icon [icon]="faComments" class="text-sky-500 w-5 h-5"></fa-icon>
         Chats
      </a>
  
      <a [routerLink]="['education']" routerLinkActive="text-primary-700 " 
         class="flex shadow-lg bg-primary-100 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
         <fa-icon [icon]="faGraduationCap" class="text-yellow-500 w-5 h-5"></fa-icon>
         Education
      </a>
  
      <a [routerLink]="['events']" routerLinkActive=" text-primary-700 "
         class="flex shadow-lg bg-primary-100 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
         <fa-icon [icon]="faCalendarCheck" class="text-purple-500 w-5 h-5"></fa-icon>
         Events
      </a>
  
      <a [routerLink]="['newsfeed']" routerLinkActive=" text-primary-700 "
         class="flex shadow-lg bg-primary-100 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
         <fa-icon [icon]="faRss" class="text-orange-500 w-5 h-5"></fa-icon>
         Newsfeeds
      </a>
  
      <a [routerLink]="['opportunity']" routerLinkActive=" text-primary-700 "
         class="flex shadow-lg bg-primary-100 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
         <fa-icon [icon]="faLightbulb" class="text-green-500 w-5 h-5"></fa-icon>
         Opportunities
      </a>
    </nav>
  
    <!-- ⚙️ Settings, Profile, Logout -->
    <div class="mt-auto pt-4 border-t border-primary-100 space-y-2 text-sm text-gray-700">
      <a [routerLink]="['profile']"
         class="flex shadow-lg bg-primary-100 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
         <fa-icon [icon]="faUserCircle" class="text-blue-600 w-5 h-5"></fa-icon>
         My Profile
      </a>
  
      <a [routerLink]="['setting']"
         class="flex shadow-lg bg-primary-100 items-center gap-3 p-2 rounded-md transition hover:bg-primary-50 hover:text-primary-700">
         <fa-icon [icon]="faCog" class="text-gray-700 w-5 h-5"></fa-icon>
         Settings
      </a>
  
      <button (click)="logout()"
              class="mt-4 w-full flex items-center gap-3 text-red-600 hover:bg-red-100 p-2 rounded-md transition text-left">
              <fa-icon [icon]="faRightFromBracket" class="w-5 h-5"></fa-icon>
              Logout
      </button>
    </div>
  </div>
