<div class="flex flex-col md:flex-row h-screen bg-gray-50 relative">
    <!-- Overlay -->
    <div *ngIf="isSidebarVisible && !isDesktop"
         class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm z-30"
         (click)="toggleSidebar()"></div>
  
    <!-- Sidebar -->
    <div class="fixed md:static h-full w-64 bg-white z-40 transition-transform duration-300 ease-in-out"
         [ngClass]="{
           'translate-x-0': isSidebarVisible || isDesktop,
           '-translate-x-full': !isSidebarVisible && !isDesktop
         }">
      <app-sidebar></app-sidebar>
    </div>
  
    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-hidden z-10">
      <app-topbar (toggleSidebar)="toggleSidebar()"></app-topbar>
      <main class="flex-1 overflow-y-auto p-4">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
