triggers:
  branches:
    include:
    - master

variables:
  dockerRegistryServiceConnection: 'acromnichannel'
  containerRegistry: 'acromnichannel.azurecr.io'
  imageRepository: 'gly-market'
  appName: 'glymarket'
  namespace: 'acromnichannel'
  subscription: 'Enterprice Core'
  vmImageName: 'ubuntu-latest'
  buildConfiguration: 'Release'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: build Dev
  condition: and(always(), contains(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: NodeTool@0
      input:
        versionSpec: '18'
      displayName: 'Install Node.js' 

    - script: |
        npm install -f
      displayName: 'install Dependencies'

    - script: |
        npm run test -- --watch=false --browsers=ChromeHeadless
      displayName: "Run Unit Tests"

    - script: |
        npm run build -- --configuration=production
      displayName: "Build Angular App"
        
         
    - task: copyfiles@2
      inputs:
        SourceFolder: '$(system.defaultworkingdirectory)/dist/point-of-sale/browser'
        contents: '**'
        TargetFolder: '$(build.artifactstagingdirectory)/dist'
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/dist'
        ArtifactName: 'angular_drop'
        publishLocation: 'Container'         

      