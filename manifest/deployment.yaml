apiVersion: apps/v1
kind: Deployment
metadata:
  name: glymarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glymarket
  template:
    metadata:
      labels:
        app: glymarket
    spec:
      containers:
        - name: glymarketsvc
          image: glymarketservice
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: glymarket
spec:
  type: NodePort
  selector:
    app: glymarket
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007
